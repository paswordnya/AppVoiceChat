<title>PipVoice — KMP MVVM Prototype</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  /* ============================================================
     DESIGN TOKENS — Material 3 x Apple HIG hybrid
     ============================================================ */
  :root{
    --primary:#5B5FEF;
    --primary-dark:#4347C4;
    --on-primary:#FFFFFF;
    --primary-container:#E4E3FF;
    --on-primary-container:#181A6B;
    --secondary:#00BFA6;
    --background:#FAFAFC;
    --surface:#FFFFFF;
    --surface-variant:#F1F0F8;
    --surface-alt:#F5F5FA;
    --outline:#E4E3EC;
    --outline-strong:#C9C8D6;
    --on-surface:#1B1B23;
    --on-surface-variant:#6E6D7E;
    --on-surface-faint:#9998A8;
    --error:#BA1A1A;
    --error-container:#FFDAD6;
    --on-error-container:#7A0000;
    --success:#1E8E5A;
    --success-container:#D7F5E4;
    --scrim:rgba(15,14,28,0.45);
    --shadow-1:0 1px 2px rgba(20,18,48,0.06), 0 1px 3px rgba(20,18,48,0.08);
    --shadow-2:0 4px 12px rgba(20,18,48,0.10);
    --shadow-3:0 16px 40px rgba(20,18,48,0.22);
    --radius-xs:8px;
    --radius-sm:12px;
    --radius-md:18px;
    --radius-lg:26px;
    --radius-full:999px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"]{
    --primary:#B4B6FF;
    --primary-dark:#9799FF;
    --on-primary:#1B1A6B;
    --primary-container:#302F91;
    --on-primary-container:#E4E3FF;
    --secondary:#5CE0C6;
    --background:#111018;
    --surface:#1A1922;
    --surface-variant:#242331;
    --surface-alt:#201F2A;
    --outline:#332F45;
    --outline-strong:#4A4560;
    --on-surface:#EDECF7;
    --on-surface-variant:#B4B2C7;
    --on-surface-faint:#7C7A93;
    --error:#FFB4AB;
    --error-container:#5C0A0A;
    --on-error-container:#FFDAD6;
    --success:#7FDCAF;
    --success-container:#0E4A32;
    --scrim:rgba(0,0,0,0.6);
    --shadow-1:0 1px 2px rgba(0,0,0,0.35);
    --shadow-2:0 4px 14px rgba(0,0,0,0.4);
    --shadow-3:0 20px 46px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:
      radial-gradient(circle at 20% 10%, #6D6FF4 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #00BFA6 0%, transparent 40%),
      #0F0E1A;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px;
    color:var(--on-surface);
    overflow-x:hidden;
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--primary); color:var(--on-primary);}

  /* ============================================================
     LAYOUT — phone shell + dev console
     ============================================================ */
  .app-wrap{display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; justify-content:center;}

  .phone-shell{position:relative;}
  .device{
    width:390px; height:844px;
    background:var(--background);
    border-radius:52px;
    border:10px solid #08070C;
    box-shadow: var(--shadow-3), 0 0 0 1.5px rgba(255,255,255,0.06) inset;
    position:relative;
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:28px; background:#08070C; border-radius:0 0 18px 18px; z-index:50;
  }
  .status-bar{
    height:48px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; font-size:15px; font-weight:600; color:var(--on-surface); position:relative; z-index:20;
    background:transparent;
  }
  .status-icons{display:flex; align-items:center; gap:5px;}
  .status-bar svg{display:block;}

  .screen-stack{flex:1; position:relative; overflow:hidden;}
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background:var(--background);
    transform:translateX(100%);
    transition:transform .32s cubic-bezier(.4,0,.2,1), opacity .32s ease;
    opacity:0;
    pointer-events:none;
    overflow:hidden;
  }
  .screen.active{transform:translateX(0); opacity:1; pointer-events:auto; z-index:10;}
  .screen.below{transform:translateX(-28%); opacity:.4; z-index:5;}
  .screen.fade{transform:translateX(0);}
  .screen-scroll{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding-bottom:24px;}
  .screen-scroll::-webkit-scrollbar{width:0;}

  .tab-bar{
    flex:0 0 auto; display:flex; align-items:stretch; justify-content:space-around;
    padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 6px);
    background:var(--surface); border-top:1px solid var(--outline);
    position:relative; z-index:30;
  }
  .tab-bar.hidden{display:none;}
  .tab-btn{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 18px 4px; border-radius:var(--radius-sm); color:var(--on-surface-faint);
    font-size:11px; font-weight:600; transition:color .15s;
  }
  .tab-btn.active{color:var(--primary);}
  .tab-btn svg{width:24px;height:24px;}

  .home-indicator{
    flex:0 0 auto; height:20px; display:flex; align-items:center; justify-content:center; background:var(--surface);
  }
  .home-indicator::after{content:""; width:120px; height:4px; border-radius:99px; background:var(--on-surface); opacity:.55;}

  /* ============================================================
     TOP APP BARS / SHARED CHROME
     ============================================================ */
  .appbar{
    display:flex; align-items:center; gap:10px; padding:10px 18px 12px; flex:0 0 auto;
  }
  .appbar-title{font-size:22px; font-weight:800; letter-spacing:-.02em; flex:1;}
  .icon-btn{
    width:38px; height:38px; border-radius:var(--radius-full); background:var(--surface-variant); border:none;
    display:flex; align-items:center; justify-content:center; color:var(--on-surface); flex:0 0 auto;
    transition:background .15s, transform .1s;
  }
  .icon-btn:active{transform:scale(.9);}
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn.primary-tint{background:var(--primary-container); color:var(--on-primary-container);}

  /* ============================================================
     BUTTONS
     ============================================================ */
  .btn{
    border:none; border-radius:var(--radius-full); padding:13px 22px; font-weight:700; font-size:15px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary); color:var(--on-primary);}
  .btn-tonal{background:var(--primary-container); color:var(--on-primary-container);}
  .btn-outline{background:transparent; color:var(--on-surface); border:1.5px solid var(--outline-strong);}
  .btn-text{background:transparent; color:var(--primary); padding:10px 12px;}
  .btn-danger{background:var(--error); color:#fff;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5; pointer-events:none;}

  /* ============================================================
     SPLASH
     ============================================================ */
  #screen-splash .splash-body{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:linear-gradient(160deg,var(--primary) 0%, #7A6BF0 55%, #00BFA6 130%);
  }
  .splash-logo{
    width:96px; height:96px; border-radius:28px; background:rgba(255,255,255,.16); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-2);
  }
  .splash-logo svg{width:48px;height:48px; color:#fff;}
  .splash-title{color:#fff; font-size:26px; font-weight:800; letter-spacing:-.02em;}
  .splash-sub{color:rgba(255,255,255,.85); font-size:13px; font-weight:500;}
  .splash-spinner{
    width:26px; height:26px; border-radius:50%; border:3px solid rgba(255,255,255,.35); border-top-color:#fff;
    animation:spin .8s linear infinite; margin-top:18px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============================================================
     ONBOARDING
     ============================================================ */
  #screen-onboarding .onb-body{flex:1; display:flex; flex-direction:column;}
  .onb-pages{flex:1; position:relative; overflow:hidden;}
  .onb-page{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; text-align:center; opacity:0; transform:translateX(24px); transition:opacity .3s, transform .3s; pointer-events:none;
  }
  .onb-page.active{opacity:1; transform:translateX(0); pointer-events:auto;}
  .onb-art{
    width:180px; height:180px; border-radius:44px; margin-bottom:28px;
    display:flex; align-items:center; justify-content:center; background:var(--primary-container);
  }
  .onb-art svg{width:84px;height:84px; color:var(--primary);}
  .onb-h{font-size:21px; font-weight:800; margin-bottom:10px;}
  .onb-p{font-size:14px; color:var(--on-surface-variant); line-height:1.5; max-width:280px;}
  .onb-dots{display:flex; gap:6px; justify-content:center; padding:14px 0;}
  .onb-dot{width:7px;height:7px;border-radius:50%; background:var(--outline-strong); transition:all .2s;}
  .onb-dot.active{width:20px; background:var(--primary);}
  .onb-footer{padding:8px 24px 22px; display:flex; flex-direction:column; gap:10px;}
  .mic-permission-card{
    margin:0 24px 14px; padding:14px; border-radius:var(--radius-md); background:var(--surface-variant);
    display:flex; gap:12px; align-items:flex-start; font-size:12.5px; color:var(--on-surface-variant); line-height:1.4;
  }
  .mic-permission-card svg{width:20px;height:20px; color:var(--primary); flex:0 0 auto; margin-top:1px;}

  /* ============================================================
     HOME — conversation list
     ============================================================ */
  .search-field{
    margin:2px 18px 10px; padding:11px 14px; border-radius:var(--radius-full); background:var(--surface-variant);
    display:flex; align-items:center; gap:9px; color:var(--on-surface-faint); font-size:14px;
  }
  .search-field svg{width:18px;height:18px; flex:0 0 auto;}
  .search-field span{opacity:.8;}
  .filter-row{display:flex; gap:8px; padding:2px 18px 12px; overflow-x:auto;}
  .filter-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 15px; border-radius:var(--radius-full); background:var(--surface-variant);
    font-size:12.5px; font-weight:700; color:var(--on-surface-variant); border:1px solid transparent; white-space:nowrap;
    transition:all .15s;
  }
  .chip.active{background:var(--primary); color:var(--on-primary);}

  .list{padding:0 14px;}
  .convo-item{
    display:flex; gap:12px; padding:12px 10px; border-radius:var(--radius-md); align-items:flex-start;
    position:relative; transition:background .15s;
  }
  .convo-item:active{background:var(--surface-variant);}
  .convo-avatar{
    width:46px;height:46px;border-radius:16px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    background:var(--primary-container); color:var(--on-primary-container);
  }
  .convo-avatar svg{width:20px;height:20px;}
  .convo-body{flex:1; min-width:0;}
  .convo-top{display:flex; align-items:center; gap:6px;}
  .convo-title{font-size:14.5px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .convo-time{font-size:11px; color:var(--on-surface-faint); flex:0 0 auto;}
  .convo-preview{font-size:12.5px; color:var(--on-surface-variant); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .convo-pin{color:var(--primary);}
  .convo-more{width:30px;height:30px; flex:0 0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--on-surface-faint); background:none; border:none;}
  .convo-more svg{width:17px;height:17px;}

  .fab{
    position:absolute; right:20px; bottom:20px; width:60px; height:60px; border-radius:24px;
    background:var(--primary); color:var(--on-primary); border:none; box-shadow:var(--shadow-2);
    display:flex; align-items:center; justify-content:center; z-index:25; transition:transform .12s;
  }
  .fab:active{transform:scale(.92);}
  .fab svg{width:26px;height:26px;}

  .refresh-spinner{
    display:flex; align-items:center; justify-content:center; height:0; overflow:hidden; transition:height .18s;
    color:var(--primary);
  }
  .refresh-spinner.show{height:44px;}
  .refresh-spinner svg{width:22px;height:22px; animation:spin .7s linear infinite;}

  /* skeletons */
  .skeleton{background:linear-gradient(90deg, var(--surface-variant) 25%, var(--outline) 37%, var(--surface-variant) 63%); background-size:400% 100%; animation:shimmer 1.3s ease infinite; border-radius:8px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .sk-row{display:flex; gap:12px; padding:12px 10px; align-items:center;}
  .sk-avatar{width:46px;height:46px;border-radius:16px;}
  .sk-lines{flex:1; display:flex; flex-direction:column; gap:8px;}
  .sk-line{height:11px; border-radius:6px;}

  /* empty / error state */
  .state-block{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 36px; gap:6px;}
  .state-icon{width:76px;height:76px;border-radius:26px; background:var(--surface-variant); display:flex; align-items:center; justify-content:center; margin-bottom:10px; color:var(--on-surface-faint);}
  .state-icon.err{background:var(--error-container); color:var(--error);}
  .state-icon svg{width:34px;height:34px;}
  .state-title{font-size:16px; font-weight:800;}
  .state-sub{font-size:13px; color:var(--on-surface-variant); line-height:1.5; margin-bottom:8px;}

  /* pagination footer */
  .load-more-row{display:flex; align-items:center; justify-content:center; padding:16px; color:var(--on-surface-faint); font-size:12.5px; gap:8px;}
  .load-more-row svg{width:16px;height:16px; animation:spin .7s linear infinite;}

  /* ============================================================
     CHAT SCREEN
     ============================================================ */
  .chat-appbar{display:flex; align-items:center; gap:10px; padding:10px 14px 10px; border-bottom:1px solid var(--outline); flex:0 0 auto;}
  .chat-title-wrap{flex:1; min-width:0;}
  .chat-title{font-size:15px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chat-sub{font-size:11px; color:var(--success); display:flex; align-items:center; gap:4px; font-weight:600;}
  .chat-sub .dot{width:6px;height:6px;border-radius:50%; background:var(--success);}

  .msg-list{flex:1; overflow-y:auto; padding:14px 14px 6px; display:flex; flex-direction:column; gap:14px;}
  .msg-row{display:flex; gap:8px; max-width:88%;}
  .msg-row.user{align-self:flex-end; flex-direction:row-reverse;}
  .msg-row.assistant{align-self:flex-start;}
  .msg-avatar{width:26px;height:26px;border-radius:9px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:var(--primary-container); color:var(--on-primary-container); margin-top:2px;}
  .msg-avatar svg{width:13px;height:13px;}
  .msg-bubble{padding:11px 14px; border-radius:18px; font-size:14px; line-height:1.5;}
  .msg-row.user .msg-bubble{background:var(--primary); color:var(--on-primary); border-bottom-right-radius:5px;}
  .msg-row.assistant .msg-bubble{background:var(--surface-variant); color:var(--on-surface); border-bottom-left-radius:5px;}
  .msg-meta{display:flex; align-items:center; gap:6px; margin-top:5px; font-size:10.5px; color:var(--on-surface-faint);}
  .msg-row.user .msg-meta{justify-content:flex-end;}
  .tts-btn{width:22px;height:22px; border-radius:50%; border:none; background:var(--surface); color:var(--primary); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-1);}
  .tts-btn svg{width:11px;height:11px;}
  .tts-btn.playing{background:var(--primary); color:#fff;}
  .voice-note-bubble{display:flex; align-items:center; gap:8px; min-width:150px;}
  .voice-note-bubble > svg{width:16px;height:16px; flex:0 0 auto;}
  .voice-note-wave{display:flex; align-items:center; gap:2px; height:20px; flex:1;}
  .voice-note-wave span{width:3px; border-radius:2px; background:currentColor; opacity:.55;}

  .typing-row{align-self:flex-start; display:flex; gap:8px; align-items:center;}
  .typing-bubble{background:var(--surface-variant); border-radius:18px; border-bottom-left-radius:5px; padding:13px 16px; display:flex; gap:4px;}
  .typing-dot{width:6px;height:6px;border-radius:50%; background:var(--on-surface-faint); animation:bounce 1.2s infinite;}
  .typing-dot:nth-child(2){animation-delay:.15s;} .typing-dot:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;}}

  .chat-error-banner{margin:0 14px 10px; padding:11px 13px; border-radius:var(--radius-sm); background:var(--error-container); color:var(--on-error-container); font-size:12.5px; display:flex; align-items:center; gap:8px;}
  .chat-error-banner svg{width:16px;height:16px; flex:0 0 auto;}
  .chat-error-banner button{margin-left:auto; font-weight:800; background:none; border:none; color:var(--on-error-container); font-size:12px; text-decoration:underline;}

  .composer{
    flex:0 0 auto; display:flex; align-items:flex-end; gap:8px; padding:10px 12px; border-top:1px solid var(--outline);
    background:var(--surface);
  }
  .composer-input{
    flex:1; min-height:40px; max-height:100px; border-radius:22px; background:var(--surface-variant); border:none;
    padding:10px 16px; font-size:14px; resize:none; color:var(--on-surface); outline:none; font-family:inherit;
  }
  .composer-input::placeholder{color:var(--on-surface-faint);}
  .composer-btn{width:40px;height:40px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; flex:0 0 auto; transition:transform .1s;}
  .composer-btn:active{transform:scale(.9);}
  .composer-btn.mic{background:var(--primary-container); color:var(--on-primary-container);}
  .composer-btn.send{background:var(--primary); color:var(--on-primary);}
  .composer-btn svg{width:19px;height:19px;}

  /* ============================================================
     VOICE CAPTURE BOTTOM SHEET
     ============================================================ */
  .sheet-scrim{position:absolute; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .25s; z-index:60;}
  .sheet-scrim.show{opacity:1; pointer-events:auto;}
  .bottom-sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--surface); border-radius:28px 28px 0 0;
    box-shadow:var(--shadow-3); transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:65; padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 26px); text-align:center;
  }
  .bottom-sheet.show{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px; border-radius:99px; background:var(--outline-strong); margin:6px auto 18px;}
  .voice-state-label{font-size:15px; font-weight:800; margin-bottom:4px;}
  .voice-state-sub{font-size:12.5px; color:var(--on-surface-variant); margin-bottom:22px; min-height:16px;}
  .voice-visualizer{height:76px; display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:22px;}
  .voice-bar{width:5px; border-radius:4px; background:var(--primary); transition:height .09s ease;}
  .voice-transcript{
    min-height:44px; font-size:14.5px; color:var(--on-surface); font-weight:600; margin-bottom:24px; padding:0 6px; line-height:1.4;
  }
  .voice-transcript.placeholder{color:var(--on-surface-faint); font-weight:500;}
  .sheet-actions{display:flex; align-items:center; justify-content:center; gap:22px;}
  .sheet-action-btn{
    width:54px;height:54px;border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; transition:transform .1s;
  }
  .sheet-action-btn:active{transform:scale(.9);}
  .sheet-action-btn.cancel{background:var(--surface-variant); color:var(--on-surface);}
  .sheet-action-btn.stop{background:var(--error); color:#fff; width:66px; height:66px;}
  .sheet-action-btn.confirm{background:var(--success); color:#fff;}
  .sheet-action-btn svg{width:24px;height:24px;}

  /* ============================================================
     SEARCH SCREEN
     ============================================================ */
  .search-header{padding:10px 18px 8px; flex:0 0 auto;}
  .search-input-row{
    display:flex; align-items:center; gap:9px; background:var(--surface-variant); border-radius:var(--radius-full);
    padding:10px 14px;
  }
  .search-input-row svg{width:18px;height:18px; color:var(--on-surface-faint); flex:0 0 auto;}
  .search-input-row input{flex:1; border:none; background:none; outline:none; font-size:14px; color:var(--on-surface);}
  .search-input-row input::placeholder{color:var(--on-surface-faint);}
  .search-clear{color:var(--on-surface-faint); background:none; border:none; display:flex;}
  .search-clear svg{width:16px;height:16px;}
  .type-filter-row{display:flex; gap:8px; padding:10px 18px 4px;}

  .recent-chip-wrap{padding:6px 18px; display:flex; flex-wrap:wrap; gap:8px;}
  .recent-chip{padding:7px 13px; border-radius:var(--radius-full); background:var(--surface-variant); font-size:12px; font-weight:600; color:var(--on-surface-variant); display:flex; align-items:center; gap:6px;}
  .recent-chip svg{width:12px;height:12px;}

  .result-item{padding:12px 18px;}
  .result-title{font-size:14px; font-weight:700; margin-bottom:3px;}

function relTime(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if (m < 1) return "now";
  if (m < 60) return m+"m";
  const h = Math.floor(m/60);
  if (h < 24) return h+"h";
  const d = Math.floor(h/24);
  if (d < 7) return d+"d";
  return new Date(ts).toLocaleDateString(undefined,{month:"short", day:"numeric"});
}
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function highlight(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + "<mark>" + escapeHtml(text.slice(idx,idx+q.length)) + "</mark>" + escapeHtml(text.slice(idx+q.length));
}

function buildConversations(){
  const now = Date.now();
  return CONVERSATION_SEEDS.map((seed, i) => ({
    id: "c"+i,
    title: seed[0],
    preview: seed[1],
    updatedAt: now - i*3600_000*7 - i*i*40000,
    pinned: i === 0 || i === 3,
    messageCount: 4 + (i % 5) * 2,
    kind: i % 4 === 0 ? "voice" : "text",
  })).sort((a,b)=> (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
}
let ALL_CONVERSATIONS = buildConversations();

function buildMessagesFor(conversation){
  const base = conversation.updatedAt - 1000*60*6;
  const msgs = [
    {id:uid(), role:"user", text:conversation.title, ts:base, voice: conversation.kind==="voice", duration: 6},
    {id:uid(), role:"assistant", text:conversation.preview, ts:base+40_000},
  ];
  const extras = [
    ["Can you give me a bit more detail on that?", "Sure — here's a deeper breakdown with a couple of concrete examples so it's easier to apply right away."],
    ["That's helpful, thanks.", "You're welcome! Let me know if you'd like me to go further, or turn this into a checklist you can act on."],
  ];
  let t = base + 90_000;
  for(let i=0;i<(conversation.messageCount-2)/2 && i<extras.length;i++){
    msgs.push({id:uid(), role:"user", text:extras[i][0], ts:t}); t+=30_000;
    msgs.push({id:uid(), role:"assistant", text:extras[i][1], ts:t}); t+=45_000;
  }
  return msgs;
}

/* ================================================================
   Mini StateFlow — mirrors kotlinx.coroutines.flow.MutableStateFlow
   ================================================================ */
class StateFlow{
  constructor(initial){ this._value = initial; this._subs = new Set(); }
  get value(){ return this._value; }
  update(patchFn){
    this._value = typeof patchFn === "function" ? {...this._value, ...patchFn(this._value)} : {...this._value, ...patchFn};
    this._emit();
  }
  set(v){ this._value = v; this._emit(); }
  subscribe(fn){ this._subs.add(fn); fn(this._value); return () => this._subs.delete(fn); }
  _emit(){ this._subs.forEach(fn => fn(this._value)); }
}

/* ================================================================
   shared/repository — Repositories (simulate API + latency + failure)
   ================================================================ */
const NET = { failRate: 0.14, latency: [500, 1100] };
let NET_FORCE_SUCCESS = false; // toggled by the Prototype Console to guarantee a "success" demo state
function simulatedFetch(result, {failRate = NET.failRate, latency = NET.latency} = {}){
  const ms = latency[0] + Math.random()*(latency[1]-latency[0]);
  return delay(ms).then(() => {
    if(!NET_FORCE_SUCCESS && Math.random() < failRate) throw new Error("Network unreachable");
    return result;
  });
}

const ConversationRepository = {
  async getConversations({page, pageSize, query, filter}){
    let items = ALL_CONVERSATIONS.slice();
    if(filter === "pinned") items = items.filter(c=>c.pinned);
    if(filter === "voice") items = items.filter(c=>c.kind==="voice");
    if(query) items = items.filter(c => c.title.toLowerCase().includes(query.toLowerCase()));
    const start = page*pageSize;
    const slice = items.slice(start, start+pageSize);
    return simulatedFetch({ items: slice, hasMore: start+pageSize < items.length, total: items.length });
  },
  async getMessages(conversationId){
    const convo = ALL_CONVERSATIONS.find(c=>c.id===conversationId);
    return simulatedFetch({ messages: buildMessagesFor(convo) }, {failRate:0.06});
  },
  async sendMessage(conversationId, text){
    return simulatedFetch({
      userMessage:{id:uid(), role:"user", text, ts:Date.now()},
    }, {failRate:0.05, latency:[150,300]});
  },
  async getAiReply(conversationId, userText){
    const replies = [
      "Got it — here's what I found. Let me know if you'd like me to expand on any part of this.",
      "Sure thing. Based on what you've told me, I'd recommend starting with the simplest approach first.",
      "Here's a concise answer, plus a follow-up thought you might find useful.",
      "That's a great question — the short version is yes, and here's why that matters in practice.",
    ];
    return simulatedFetch({
      message:{id:uid(), role:"assistant", text:replies[Math.floor(Math.random()*replies.length)], ts:Date.now()}
    }, {failRate:0.18, latency:[900,1800]});
  },
  async deleteConversation(id){
    return simulatedFetch({ok:true}, {failRate:0.05, latency:[200,400]});
  },
  async searchAll(query, type){
    await delay(260 + Math.random()*300);
    if(Math.random() < 0.08) throw new Error("Search index unavailable");
    if(!query) return [];
    return ALL_CONVERSATIONS
      .filter(c => (type==="all"||c.kind===type) && (c.title.toLowerCase().includes(query.toLowerCase()) || c.preview.toLowerCase().includes(query.toLowerCase())))
      .map(c => ({ conversationId:c.id, title:c.title, snippet:c.preview, ts:c.updatedAt, kind:c.kind }));
  }
};

class HomeViewModelImpl{
  constructor(){
    this.pageSize = 6;
    this.state = new StateFlow({
      status:"loading",        // loading | success | error | empty
      conversations:[],
      filter:"all",             // all | pinned | voice
      searchKeyword:"",
      page:0,
      hasMore:true,
      isRefreshing:false,
      isLoadingMore:false,
      error:null,
    });
  }
  async load(){
    this.state.update({status:"loading", error:null});
    try{
      const res = await GetConversationsUseCase({page:0, pageSize:this.pageSize, query:this.state.value.searchKeyword, filter:this.state.value.filter});
      this.state.update({ status: res.items.length? "success":"empty", conversations:res.items, page:0, hasMore:res.hasMore, error:null });
    }catch(e){
      this.state.update({ status:"error", error: e.message });
    }
  }
  async refresh(){
    this.state.update({isRefreshing:true});
    try{
      const res = await GetConversationsUseCase({page:0, pageSize:this.pageSize, query:this.state.value.searchKeyword, filter:this.state.value.filter});
      this.state.update({ status: res.items.length? "success":"empty", conversations:res.items, page:0, hasMore:res.hasMore, isRefreshing:false, error:null });
    }catch(e){
      this.state.update({ isRefreshing:false });
      UiEvents.snackbar("Couldn't refresh — check your connection", "Retry", () => this.refresh());
    }
  }
  async loadMore(){
    if(!this.state.value.hasMore || this.state.value.isLoadingMore || this.state.value.status!=="success") return;
    this.state.update({isLoadingMore:true});
    try{
      const nextPage = this.state.value.page+1;
      const res = await GetConversationsUseCase({page:nextPage, pageSize:this.pageSize, query:this.state.value.searchKeyword, filter:this.state.value.filter});
      this.state.update(s => ({ conversations:[...s.conversations, ...res.items], page:nextPage, hasMore:res.hasMore, isLoadingMore:false }));
    }catch(e){
      this.state.update({isLoadingMore:false});
      UiEvents.snackbar("Couldn't load more conversations", "Retry", () => this.loadMore());
    }
  }
  onFilterSelected(filter){ this.state.update({filter}); this.load(); }
  onSearchShortcutTapped(){ Nav.push("search"); }
  async onConversationTapped(id){ Nav.push("chat", {conversationId:id}); }
  async onDeleteConversation(id){
    const removed = ALL_CONVERSATIONS.find(c=>c.id===id);
    ALL_CONVERSATIONS = ALL_CONVERSATIONS.filter(c=>c.id!==id);
    this.state.update(s=>({ conversations:s.conversations.filter(c=>c.id!==id) }));
    try{ await DeleteConversationUseCase(id); }catch(e){}
    UiEvents.snackbar("Conversation deleted", "Undo", () => {
      ALL_CONVERSATIONS.push(removed);
      ALL_CONVERSATIONS.sort((a,b)=> (b.pinned-a.pinned)||(b.updatedAt-a.updatedAt));
      this.load();
    });
  }
  onNewVoiceChat(){ VoiceCaptureViewModel.open({ mode:"new" }); }
  onRetry(){ this.load(); }
  _debugSetState(status){
    if(status==="loading") this.state.update({status:"loading"});
    if(status==="error") this.state.update({status:"error", error:"Simulated network failure"});
    if(status==="empty") this.state.update({status:"empty", conversations:[]});
    if(status==="success") this.load();
  }
}

/* ---------- ChatViewModel ---------- */
class ChatViewModelImpl{
  constructor(){
    this.state = new StateFlow({
      status:"loading",   // loading | success | error | empty
      conversationId:null,
      title:"",
      messages:[],
      isAiTyping:false,
      inputText:"",
      playingMessageId:null,
      error:null,
    });
  }
  async open(conversationId){
    let convo = ALL_CONVERSATIONS.find(c=>c.id===conversationId);
    let title = convo ? convo.title : "New conversation";
    this.state.set({ status:"loading", conversationId, title, messages:[], isAiTyping:false, inputText:"", playingMessageId:null, error:null });
    if(!convo){
      this.state.update({status:"success", messages:[]});
      return;
    }
    try{
      const res = await GetMessagesUseCase(conversationId);
      this.state.update({ status: res.messages.length? "success":"empty", messages:res.messages });
    }catch(e){
      this.state.update({ status:"error", error:e.message });
    }
  }
  onInputChanged(v){ this.state.update({inputText:v}); }
  async onSend(){
    const text = this.state.value.inputText.trim();
    if(!text) return;
    this.state.update({inputText:""});
    await this._sendText(text);
  }
  async _sendText(text){
    const optimistic = {id:uid(), role:"user", text, ts:Date.now(), pending:true};
    this.state.update(s=>({ messages:[...s.messages, optimistic], status:"success", error:null }));
    try{
      await SendMessageUseCase(this.state.value.conversationId, text);
      this.state.update(s=>({ messages:s.messages.map(m=>m.id===optimistic.id?{...m,pending:false}:m) }));
      this.state.update({isAiTyping:true});
      const res = await GetAiReplyUseCase(this.state.value.conversationId, text);
      this.state.update(s=>({ isAiTyping:false, messages:[...s.messages, res.message] }));
    }catch(e){
      this.state.update(s=>({ isAiTyping:false, error:"Pip couldn't respond. Check your connection and try again." }));
    }
  }
  onDismissError(){ this.state.update({error:null}); }
  onRetryLastMessage(){
    const lastUser = [...this.state.value.messages].reverse().find(m=>m.role==="user");
    this.state.update({error:null});
    if(lastUser) this._sendPlainRetry(lastUser.text);
  }
  async _sendPlainRetry(text){
    this.state.update({isAiTyping:true});
    try{
      const res = await GetAiReplyUseCase(this.state.value.conversationId, text);
      this.state.update(s=>({ isAiTyping:false, messages:[...s.messages, res.message] }));
    }catch(e){
      this.state.update({ isAiTyping:false, error:"Pip couldn't respond. Check your connection and try again." });
    }
  }
  onMicTapped(){ VoiceCaptureViewModel.open({ mode:"append" }); }
  async onVoiceMessageReady(transcript){
    await this._sendText(transcript);
  }
  onTogglePlayback(messageId){
    const cur = this.state.value.playingMessageId;
    if(cur === messageId){ this.state.update({playingMessageId:null}); return; }
    this.state.update({playingMessageId:messageId});
    delay(2600).then(()=>{ if(this.state.value.playingMessageId===messageId) this.state.update({playingMessageId:null}); });
  }
  onCopyMessage(text){ UiEvents.snackbar("Copied to clipboard"); }
  onRetry(){ this.open(this.state.value.conversationId); }
  _debugSetState(status){
    if(status==="loading") this.state.update({status:"loading"});
    if(status==="error") this.state.update({status:"error", error:"Simulated network failure"});
    if(status==="empty") this.state.update({status:"empty", messages:[]});
    if(status==="success") this.open(this.state.value.conversationId || "c0");
  }
}
const ChatViewModel = new ChatViewModelImpl();

/* ---------- VoiceCaptureViewModel (drives the voice bottom sheet) ---------- */
class VoiceCaptureViewModelImpl{
  constructor(){
    this.state = new StateFlow({
      isOpen:false,
      phase:"listening",   // listening | processing | error
      transcript:"",
      elapsedSec:0,
      amplitude: new Array(28).fill(4),
      mode:"new",
    });
    this._timer = null; this._amp = null;
  }
  open({mode}){
    this.state.set({ isOpen:true, phase:"listening", transcript:"", elapsedSec:0, amplitude:new Array(28).fill(4), mode });
    this._runCapture();
    this._amp = setInterval(()=>{
      if(this.state.value.phase!=="listening") return;
      const amp = this.state.value.amplitude.slice(1);
      amp.push(6 + Math.random()*46);
      this.state.update({amplitude:amp});
    }, 90);
    this._timer = setInterval(()=>{
      if(this.state.value.phase==="listening") this.state.update(s=>({elapsedSec:s.elapsedSec+1}));
    }, 1000);
  }
  async _runCapture(){
    try{
      const res = await TranscribeVoiceUseCase(partial => {
        if(this.state.value.isOpen) this.state.update({transcript:partial});
      });
      if(this.state.value.isOpen) this.state.update({transcript:res.transcript});
    }catch(e){
      if(this.state.value.isOpen) this.state.update({phase:"error"});
    }
  }
  onStop(){
    this.state.update({phase:"processing"});
    delay(500).then(()=>{
      if(this.state.value.isOpen) this.onConfirm();
    });
  }
  onCancel(){ this._teardown(); }
  onConfirm(){
    const transcript = this.state.value.transcript || "What's a good recipe for dinner tonight?";
    const mode = this.state.value.mode;
    this._teardown();
    if(mode === "new"){
      const convo = { id:"c"+Date.now(), title:transcript, preview:"", updatedAt:Date.now(), pinned:false, messageCount:0, kind:"voice" };
      ALL_CONVERSATIONS.unshift(convo);
      Nav.push("chat", {conversationId:convo.id, seedVoiceText:transcript});
    } else {
      ChatViewModel.onVoiceMessageReady(transcript);
    }
  }
  onRetryCapture(){ this.state.update({phase:"listening", transcript:"", elapsedSec:0}); this._runCapture(); }
  _teardown(){
    clearInterval(this._timer); clearInterval(this._amp);
    this.state.update({isOpen:false});
  }
}
const VoiceCaptureViewModel = new VoiceCaptureViewModelImpl();

    this.state.update({query:q});

    this._debounceTimer = setTimeout(()=> this._runSearch(), 320);
  }

  onRecentTapped(term){ this.state.update({query:term}); this._runSearch(); }

    try{
      const results = await SearchConversationsUseCase(this.state.value.query, this.state.value.type);
      this.state.update({ status: results.length? "success":"empty", results });
      if(results.length){
        this.state.update(s=>({ recent:[s.query, ...s.recent.filter(t=>t!==s.query)].slice(0,5) }));

    }catch(e){
      this.state.update({status:"error", error:e.message});

    if(status==="error") this.state.update({status:"error", error:"Simulated search failure"});
    if(status==="empty") this.state.update({status:"empty", results:[]});
    if(status==="success") this._runSearch();
  }
}

      confirmLabel:"Log out", confirmStyle:"btn-danger", cancelLabel:"Cancel",
      onConfirm: async () => { await LogoutUseCase(); UiEvents.closeDialog(); UiEvents.snackbar("Signed out successfully"); }
    });
  }
  onRetry(){ this.load(); }
  _debugSetState(status){
    if(status==="loading") this.state.update({status:"loading"});
    if(status==="error") this.state.update({status:"error", error:"Simulated profile failure"});
    if(status==="success") this.load();
  }
}
const ProfileViewModel = new ProfileViewModelImpl();

/* ================================================================
   UI-GLOBAL EVENTS — snackbar / dialog orchestration (cross-screen)
   ================================================================ */
const UiEvents = {
  _snackTimer:null,
  snackbar(message, actionLabel, actionFn){
    const el = document.getElementById("snackbar");
    clearTimeout(this._snackTimer);
    el.innerHTML = `<span>${escapeHtml(message)}</span>` + (actionLabel ? `<button id="snackActionBtn">${escapeHtml(actionLabel)}</button>` : "");
    el.classList.add("show");
    if(actionLabel) document.getElementById("snackActionBtn").onclick = () => { actionFn && actionFn(); el.classList.remove("show"); };
    this._snackTimer = setTimeout(()=> el.classList.remove("show"), 3600);
  },
  dialog({icon, title, message, confirmLabel, confirmStyle="btn-primary", cancelLabel, onConfirm}){
    const scrim = document.getElementById("dialogScrim");
    const box = document.getElementById("dialogBox");
    box.innerHTML = `
      ${icon?`<div class="dialog-icon">${ICONS[icon]}</div>`:""}
      <div class="dialog-title">${escapeHtml(title)}</div>
      <div class="dialog-msg">${escapeHtml(message)}</div>
      <div class="dialog-actions">
        ${cancelLabel?`<button class="btn btn-outline" id="dlgCancel">${escapeHtml(cancelLabel)}</button>`:""}
        <button class="btn ${confirmStyle}" id="dlgConfirm">${escapeHtml(confirmLabel)}</button>
      </div>`;
    scrim.classList.add("show");
    document.getElementById("dlgConfirm").onclick = () => onConfirm && onConfirm();
    const cancelBtn = document.getElementById("dlgCancel");
    if(cancelBtn) cancelBtn.onclick = () => this.closeDialog();
  },
  closeDialog(){ document.getElementById("dialogScrim").classList.remove("show"); }
};

/* ================================================================
   NavController — screen stack + tab switching
   ================================================================ */
const Nav = {
  stack:["splash"],
  tabRoutes:["home","search","profile"],
  params:{},
  push(route, params={}){
    this.params[route] = params;
    this.stack.push(route);
    this._render(true);
    if(route==="chat") ChatViewModel.open(params.conversationId);
    if(route==="settings") SettingsViewModel.load();
  },
  pop(){
    if(this.stack.length<=1) return;
    this.stack.pop();
    this._render(false);
  },
  switchTab(route){
    this.stack = [route];
    this._render(false);
    if(route==="home" && HomeViewModel.state.value.status==="loading" && HomeViewModel.state.value.conversations.length===0) HomeViewModel.load();
    if(route==="profile") ProfileViewModel.load();
  },
  replaceRoot(route){
    this.stack = [route];
    this._render(false);
    if(route==="home") HomeViewModel.load();
  },
  current(){ return this.stack[this.stack.length-1]; },
  _render(isPush){
    document.querySelectorAll(".screen").forEach(el => el.classList.remove("active","below"));
    const cur = this.current();
    const el = document.getElementById("screen-"+cur);
    el.classList.add("active");
    const tabBar = document.getElementById("tabBar");
    const homeIndicator = document.getElementById("homeIndicator");
    const showTabs = this.tabRoutes.includes(cur) && this.stack.length===1;
    tabBar.classList.toggle("hidden", !showTabs);
    homeIndicator.style.display = "flex";
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab===cur));
    renderScreen(cur);
  }
};

/* ================================================================
   RENDER — ui layer. Each function "observes" a ViewModel's StateFlow
   (mirrors collectAsState() on Android / Swift StateFlow bridge on iOS)
   ================================================================ */
function renderScreen(route){
  ({
    splash: renderSplash, onboarding: renderOnboarding, home: renderHome,
    chat: renderChat, search: renderSearch, profile: renderProfile, settings: renderSettings,
  }[route])();
}

    <button class="fab" id="homeFab" aria-label="New voice chat">${icon("mic")}</button>
  `;

  el.querySelector("#homeFab").onclick = () => HomeViewModel.onNewVoiceChat();
  el.querySelector("#homeSearchShortcut").onclick = () => HomeViewModel.onSearchShortcutTapped();
  el.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => HomeViewModel.onFilterSelected(b.dataset.filter));
  const retry = el.querySelector("#homeRetry"); if(retry) retry.onclick = () => HomeViewModel.onRetry();
  const emptyNew = el.querySelector("#homeEmptyNew"); if(emptyNew) emptyNew.onclick = () => HomeViewModel.onNewVoiceChat();
  const clearFilter = el.querySelector("#homeClearFilter"); if(clearFilter) clearFilter.onclick = () => { HomeViewModel.state.update({filter:"all", searchKeyword:""}); HomeViewModel.load(); };

  el.querySelectorAll(".convo-item").forEach(row => {
    row.addEventListener("click", (ev) => {
      if(ev.target.closest("[data-more]")) return;
      HomeViewModel.onConversationTapped(row.dataset.id);
    });
  });
  el.querySelectorAll("[data-more]").forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.more;
      const convo = HomeViewModel.state.value.conversations.find(c=>c.id===id);

    };
  });

  const scroll = el.querySelector("#homeScroll");
  if(scroll){
    let startY=null, pulling=false;
    scroll.addEventListener("touchstart", e => { if(scroll.scrollTop<=0){ startY=e.touches[0].clientY; } }, {passive:true});
    scroll.addEventListener("touchmove", e => {
      if(startY==null) return;
      const dy = e.touches[0].clientY - startY;
      if(dy > 60 && !pulling){ pulling=true; }

    scroll.addEventListener("touchend", () => {
      if(pulling && !HomeViewModel.state.value.isRefreshing) HomeViewModel.refresh();
      startY=null; pulling=false;
    });
    scroll.addEventListener("scroll", () => {
      if(scroll.scrollTop + scroll.clientHeight > scroll.scrollHeight - 80) HomeViewModel.loadMore();
    });
  }
}

let __voiceSheetSig = null; // tracks isOpen+phase so rapid amplitude ticks don't rebuild button DOM under a user's tap
function renderVoiceSheet(){
  const s = VoiceCaptureViewModel.state.value;
  const scrim = document.getElementById("sheetScrim");
  const sheet = document.getElementById("voiceSheet");
  scrim.classList.toggle("show", s.isOpen);
  sheet.classList.toggle("show", s.isOpen);
  if(!s.isOpen){ __voiceSheetSig = null; return; }

  const sig = s.isOpen + "|" + s.phase;
  if(sig !== __voiceSheetSig){
    __voiceSheetSig = sig;
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="voice-state-label"></div>
      <div class="voice-state-sub"></div>
      <div class="voice-visualizer">
        ${s.phase==="listening"
          ? s.amplitude.map(h => `<div class="voice-bar" style="height:${h}px"></div>`).join("")
          : s.phase==="processing"
            ? `<div class="splash-spinner" style="border-color:var(--outline); border-top-color:var(--primary);"></div>`
            : `<div class="state-icon err" style="margin:0;">${icon("alert")}</div>`}
      </div>
      <div class="voice-transcript"></div>
      <div class="sheet-actions">
        ${s.phase==="listening" ? `
          <button class="sheet-action-btn cancel" id="vcCancel">${icon("close")}</button>
          <button class="sheet-action-btn stop" id="vcStop">${icon("stop")}</button>
          <button class="sheet-action-btn confirm" id="vcConfirm">${icon("check")}</button>
        ` : s.phase==="error" ? `
          <button class="sheet-action-btn cancel" id="vcCancel">${icon("close")}</button>
          <button class="sheet-action-btn stop" id="vcRetryCapture" style="background:var(--primary);">${icon("mic")}</button>
        ` : ``}
      </div>
    `;
    const cancel = sheet.querySelector("#vcCancel"); if(cancel) cancel.onclick = () => VoiceCaptureViewModel.onCancel();
    const stop = sheet.querySelector("#vcStop"); if(stop) stop.onclick = () => VoiceCaptureViewModel.onStop();
    const confirm = sheet.querySelector("#vcConfirm"); if(confirm) confirm.onclick = () => VoiceCaptureViewModel.onConfirm();
    const retryCap = sheet.querySelector("#vcRetryCapture"); if(retryCap) retryCap.onclick = () => VoiceCaptureViewModel.onRetryCapture();
  }

  // cosmetic-only updates (waveform amplitude, timer, live transcript) — patched in place
  // so the action buttons above stay stable DOM nodes across every ~90ms amplitude tick.
  const label = s.phase==="listening" ? "Listening…" : s.phase==="processing" ? "Processing…" : "Couldn't hear that";
  const sub = s.phase==="listening" ? `${String(Math.floor(s.elapsedSec/60)).padStart(2,'0')}:${String(s.elapsedSec%60).padStart(2,'0')}` : s.phase==="processing" ? "Sending to Pip" : "Check your microphone and try again";
  sheet.querySelector(".voice-state-label").textContent = label;
  sheet.querySelector(".voice-state-sub").textContent = sub;
  const transcriptEl = sheet.querySelector(".voice-transcript");
  transcriptEl.textContent = s.transcript ? s.transcript : "Say something like “what's the weather tomorrow?”";
  transcriptEl.classList.toggle("placeholder", !s.transcript);
  if(s.phase==="listening"){
    const bars = sheet.querySelectorAll(".voice-bar");
    bars.forEach((bar,i) => { if(s.amplitude[i]!=null) bar.style.height = s.amplitude[i]+"px"; });
  }
}

  const clearBtn = el.querySelector("#searchClearBtn"); if(clearBtn) clearBtn.onclick = () => SearchViewModel.onClear();
  el.querySelectorAll("[data-type]").forEach(b => b.onclick = () => SearchViewModel.onTypeFilterChanged(b.dataset.type));
  el.querySelectorAll("[data-recent]").forEach(b => b.onclick = () => SearchViewModel.onRecentTapped(b.dataset.recent));
  const retry = el.querySelector("#searchRetry"); if(retry) retry.onclick = () => SearchViewModel.onRetry();
  el.querySelectorAll("[data-result]").forEach(r => r.onclick = () => SearchViewModel.onResultTapped(r.dataset.result));
}
SearchViewModel.state.subscribe(() => { if(Nav.current()==="search") renderSearch(); });

/* ---------- Profile ---------- */
function renderProfile(){
  const s = ProfileViewModel.state.value;
  const el = document.getElementById("screen-profile");

  let body = "";
  if(s.status==="loading"){
    body = `
      <div class="profile-card" style="background:var(--surface-variant);">
        <div class="skeleton" style="width:68px;height:68px;border-radius:24px;margin:0 auto 12px;"></div>
        <div class="skeleton sk-line" style="width:120px;height:14px;margin:0 auto 8px;"></div>
        <div class="skeleton sk-line" style="width:160px;height:11px;margin:0 auto;"></div>
      </div>`;
  } else if(s.status==="error"){
    body = `<div class="state-block">
      <div class="state-icon err">${icon("alert")}</div>
      <div class="state-title">Couldn't load profile</div>
      <div class="state-sub">${escapeHtml(s.error||"Something went wrong.")}</div>
      <button class="btn btn-primary" id="profileRetry">Retry</button>
    </div>`;
  } else {
    const p = s.profile;
    const pct = Math.round(p.usage.minutesUsed/p.usage.minutesLimit*100);
    body = `
      <div class="profile-card">
        <div class="profile-avatar">${initials(p.name)}</div>
        <div class="profile-name">${escapeHtml(p.name)}</div>
        <div class="profile-email">${escapeHtml(p.email)}</div>
        <div class="profile-plan">${icon("crown")} ${p.plan} Plan</div>
      </div>
      <div class="usage-card">
        <div class="usage-top"><span>Voice minutes used</span><span>${p.usage.minutesUsed} / ${p.usage.minutesLimit} min</span></div>
        <div class="usage-bar"><div class="usage-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="menu-section">
        <div class="menu-section-title">Account</div>
        <div class="menu-list">
          <button class="menu-item" id="profileSettings"><svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.gear.match(/<path[^>]*>|<circle[^>]*>/g).join("")}</svg><span class="menu-item-label">Settings</span><svg class="trailing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
          <button class="menu-item" id="profileNotif"><svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.bell.match(/<path[^>]*>/g).join("")}</svg><span class="menu-item-label">Notifications</span><span class="menu-item-value">On</span></button>
          <button class="menu-item" id="profilePrivacy"><svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.shield.match(/<path[^>]*>/g).join("")}</svg><span class="menu-item-label">Privacy &amp; Data</span><svg class="trailing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-list">
          <button class="menu-item danger" id="profileLogout"><svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.logout.match(/<path[^>]*>/g).join("")}</svg><span class="menu-item-label">Log out</span></button>
        </div>
      </div>
    `;
  }

  el.innerHTML = `
    <div class="appbar"><div class="appbar-title">Profile</div></div>
    <div class="screen-scroll">${body}</div>
  `;
  const retry = el.querySelector("#profileRetry"); if(retry) retry.onclick = () => ProfileViewModel.onRetry();
  const settingsBtn = el.querySelector("#profileSettings"); if(settingsBtn) settingsBtn.onclick = () => ProfileViewModel.onSettingsTapped();
  const notif = el.querySelector("#profileNotif"); if(notif) notif.onclick = () => UiEvents.snackbar("Notification settings coming soon");
  const priv = el.querySelector("#profilePrivacy"); if(priv) priv.onclick = () => UiEvents.snackbar("Privacy & data settings coming soon");
  const logout = el.querySelector("#profileLogout"); if(logout) logout.onclick = () => ProfileViewModel.onLogoutTapped();
}
ProfileViewModel.state.subscribe(() => { if(Nav.current()==="profile") renderProfile(); });

/* ---------- Settings ---------- */
function renderSettings(){
  const s = SettingsViewModel.state.value;
  const el = document.getElementById("screen-settings");

  let body = "";
  if(s.status==="loading"){
    body = `<div style="padding:16px 18px;">` + Array.from({length:4}).map(()=>`<div class="skeleton" style="height:58px;border-radius:14px;margin-bottom:10px;"></div>`).join("") + `</div>`;
  } else if(s.status==="error"){
    body = `<div class="state-block">
      <div class="state-icon err">${icon("alert")}</div>
      <div class="state-title">Couldn't load settings</div>
      <div class="state-sub">${escapeHtml(s.error||"Something went wrong.")}</div>
      <button class="btn btn-primary" id="settingsRetry">Retry</button>
    </div>`;
  } else {
    const st = s.settings;
    body = `
      <div class="menu-section" style="margin-top:16px;">
        <div class="menu-section-title">Assistant voice</div>
        ${VOICE_MODELS.map(v => `
          <div class="voice-option ${st.selectedVoiceId===v.id?'selected':''}" data-voice="${v.id}">
            <div class="voice-swatch" style="background:${v.color}">${v.name[0]}</div>
            <div class="voice-option-body"><div class="voice-option-name">${v.name}</div><div class="voice-option-desc">${v.desc}</div></div>
            <button class="play-sample-btn" data-play="${v.id}">${icon("play")}</button>
            <div class="voice-option-radio"></div>
          </div>`).join("")}
      </div>
      <div class="menu-section">
        <div class="menu-section-title">Preferences</div>
        <div class="menu-list">
          <button class="menu-item" id="settingsLanguage"><svg class="leading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS.globe.match(/<path[^>]*>|<circle[^>]*>/g).join("")}</svg><span class="menu-item-label">Language</span><span class="menu-item-value">${st.language}</span></button>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-list">
          <div class="toggle-row"><div class="toggle-row-body"><div class="toggle-row-title">Auto-play responses</div><div class="toggle-row-sub">Speak Pip's replies out loud automatically</div></div><button class="switch ${st.autoPlayResponses?'on':''}" id="toggleAutoplay"></button></div>
          <div class="toggle-row"><div class="toggle-row-body"><div class="toggle-row-title">Wake word ("Hey Pip")</div><div class="toggle-row-sub">Start listening without tapping the mic</div></div><button class="switch ${st.wakeWordEnabled?'on':''}" id="toggleWakeword"></button></div>
          <div class="toggle-row"><div class="toggle-row-body"><div class="toggle-row-title">Save conversation history</div><div class="toggle-row-sub">Keep past chats for search &amp; recall</div></div><button class="switch ${st.saveHistory?'on':''}" id="toggleHistory"></button></div>
        </div>
      </div>
      <div class="menu-section">
        <div class="menu-section-title">Appearance</div>
        <div class="theme-row">
          <button class="theme-opt ${st.theme==='light'?'selected':''}" data-theme-opt="light">${icon("sun")}Light</button>
          <button class="theme-opt ${st.theme==='dark'?'selected':''}" data-theme-opt="dark">${icon("moon")}Dark</button>
          <button class="theme-opt ${st.theme==='system'?'selected':''}" data-theme-opt="system">${icon("phone")}System</button>
        </div>
      </div>
    `;
  }

  el.innerHTML = `
    <div class="appbar">
      <button class="icon-btn" id="settingsBack">${icon("back")}</button>
      <div class="appbar-title">Settings</div>
    </div>
    <div class="screen-scroll">${body}</div>
  `;
  el.querySelector("#settingsBack").onclick = () => Nav.pop();
  const retry = el.querySelector("#settingsRetry"); if(retry) retry.onclick = () => SettingsViewModel.onRetry();

  el.querySelectorAll("[data-voice]").forEach(v => v.addEventListener("click", e => {
    if(e.target.closest("[data-play]")) return;
    SettingsViewModel.onVoiceSelected(v.dataset.voice);
  }));
  el.querySelectorAll("[data-play]").forEach(b => b.onclick = (e) => { e.stopPropagation(); SettingsViewModel.onPlaySample(b.dataset.play); });
  const langBtn = el.querySelector("#settingsLanguage");
  if(langBtn) langBtn.onclick = () => UiEvents.dialog({
    title:"Choose language", message:"Select the language Pip should use for responses.",
    confirmLabel:"Cancel", confirmStyle:"btn-outline", onConfirm: () => UiEvents.closeDialog(),
  });
  const autoplay = el.querySelector("#toggleAutoplay"); if(autoplay) autoplay.onclick = () => SettingsViewModel.onAutoPlayToggled();
  const wake = el.querySelector("#toggleWakeword"); if(wake) wake.onclick = () => SettingsViewModel.onWakeWordToggled();
  const hist = el.querySelector("#toggleHistory"); if(hist) hist.onclick = () => SettingsViewModel.onSaveHistoryToggled();
  el.querySelectorAll("[data-theme-opt]").forEach(b => b.onclick = () => SettingsViewModel.onThemeSelected(b.dataset.themeOpt));
}
SettingsViewModel.state.subscribe(() => { if(Nav.current()==="settings") renderSettings(); });

function applyTheme(theme){
  const resolved = theme==="system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light") : theme;
  document.documentElement.setAttribute("data-theme", resolved);
}

/* ================================================================
   TAB BAR + BACK GESTURE
   ================================================================ */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => Nav.switchTab(btn.dataset.tab);
});
document.getElementById("dialogScrim").addEventListener("click", (e) => { if(e.target.id==="dialogScrim") UiEvents.closeDialog(); });

/* swipe-from-edge back gesture on the device */
(function(){
  let startX=null, startedAtEdge=false;
  const device = document.getElementById("device");
  device.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startedAtEdge = startX < 24 && Nav.stack.length>1;
  }, {passive:true});
  device.addEventListener("touchend", e => {
    if(startedAtEdge && e.changedTouches[0].clientX - startX > 60) Nav.pop();
    startX=null; startedAtEdge=false;
  });
})();

/* ================================================================
   CLOCK
   ================================================================ */
function tickClock(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
tickClock(); setInterval(tickClock, 15000);

/* ================================================================
   DEV / PROTOTYPE CONSOLE
   ================================================================ */
const DEV_GROUPS = [
  {label:"Home", vm:HomeViewModel, states:["loading","error","empty","success"]},
  {label:"Chat", vm:ChatViewModel, states:["loading","error","empty","success"]},
  {label:"Search", vm:SearchViewModel, states:["loading","error","empty","success"]},
  {label:"Settings", vm:SettingsViewModel, states:["loading","error","success"]},
  {label:"Profile", vm:ProfileViewModel, states:["loading","error","success"]},
];
document.getElementById("devGroups").innerHTML = DEV_GROUPS.map(g => `
  <div class="dev-group">
    <div class="dev-group-title">${g.label}ViewModel</div>
    <div class="dev-btn-row">${g.states.map(st => `<button class="dev-btn" data-vm="${g.label}" data-state="${st}">${st}</button>`).join("")}</div>
  </div>`).join("");
document.querySelectorAll("[data-vm]").forEach(b => {
  b.onclick = () => {
    const group = DEV_GROUPS.find(g=>g.label===b.dataset.vm);
    const routeMap = {Home:"home", Chat:"chat", Search:"search", Settings:"settings", Profile:"profile"};
    const route = routeMap[b.dataset.vm];
    NET_FORCE_SUCCESS = b.dataset.state === "success";
    if(Nav.current()!==route){
      if(route==="chat") Nav.push("chat", {conversationId:"c0"});
      else if(route==="settings") Nav.push("settings");
      else Nav.switchTab(route);
    }
    group.vm._debugSetState(b.dataset.state);
    if(b.dataset.state === "success") setTimeout(() => { NET_FORCE_SUCCESS = false; }, 2000);
  };
});

/* ================================================================
   APP INIT
   ================================================================ */
applyTheme("light");
renderSplash();
document.getElementById("screen-splash").classList.add("active");
SplashViewModel.init();
</script>
